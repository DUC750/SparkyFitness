name: Test APK

on:
  push:
    branches: ["test-apk/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:MaxMetaspaceSize=1024m\""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install and prebuild
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          APP_VARIANT=dev npx expo prebuild --platform android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
      - name: Codegen async-storage
        run: cd SparkyFitnessMobile/android && ./gradlew :react-native-async-storage_async-storage:generateCodegenArtifactsFromSchema
      - name: Build APK
        run: cd SparkyFitnessMobile/android && ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: test-apk
          path: SparkyFitnessMobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
